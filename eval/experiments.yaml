# FaceGuard experiment sweep (docs/EVALUATION.md section 4).
#   python eval/run_experiments.py --config eval/experiments.yaml
# Regenerates eval/out/*.png, eval/out/raw_results.json and the generated
# block of docs/RESULTS.md.

runs: 3                     # timing repeats per configuration (mean ± std)
out: eval/out
results_md: docs/RESULTS.md

# Config overrides shared by every run; anything not listed uses core/types.py defaults.
base_config:
  mode: pixelate

experiments: [e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11, e12, e13, e14, e15, e16]

videos:
  # Synthetic clips: exact per-frame boxes. Regenerate with scripts/make_*_clip.py.
  - truth: data/samples/synthetic_er.gt.json
  - truth: data/samples/synthetic_cross.gt.json
  # Hand-annotated real clips (eval/annotate.py video ...). Skipped if missing.
  - truth: data/ground_truth.json

images:
  annotated: [data/ground_truth.json]       # eval/annotate.py images ...
  synthetic_stills:                         # exact boxes, condition = segment
    truth: data/samples/synthetic_er.gt.json
    every: 15

e1_detectors: [yunet, haar]
e2_intervals: [1, 5, 10, 15, 30]
e3_interval: 10
e3_trackers: [lk, csrt, kcf, none, "off"]   # quoted: YAML reads bare off as false
e4_thresholds: [0.3, 0.5, 0.6, 0.7, 0.9]
e6_paddings: [0.0, 0.1, 0.2, 0.25, 0.3]
e7_unconfirmed_intervals: [1, 3]   # E7: re-detect every N frames while a track is unconfirmed
e8_paddings: [0.0, 0.1, 0.2, 0.25]  # E8: ellipse vs rectangle mask
e9_windows: [1, 3, 5, 9]            # E9: smoothing window (frames)
e10_trackers: [lk, csrt, kcf]       # E10: freeze vs coast when lost
e11_tile_grids: [2, 3]              # E11: tiled detection on the real photos
e12_backfill: [0, 5, 10, 20]        # E12: frames tracked backwards from a new face (D-026)
e13_settings:                       # E13: attack the redacted output (detect + SFace re-identification)
  - {label: "blur (default 0.35)", mode: blur}
  - {label: "blur, strength 1.0", mode: blur, blur_strength: 1.0}
  - {label: "pixelate (default 8 blocks)", mode: pixelate}
  - {label: "pixelate, 5 blocks", mode: pixelate, pixel_blocks: 5}
  - {label: "pixelate, 3 blocks", mode: pixelate, pixel_blocks: 3}
  - {label: "fill", mode: fill}
e14_trackers: [lk, kcf]             # E14: association / re-ID / motion-model variants (D-029..D-031)
e14_variants:
  - {label: baseline}
  - {label: Hungarian association, association: hungarian}
  - {label: re-ID linking, reid_link: true}
  - {label: "coast, velocity", coast: true}
  - {label: "coast, Kalman", coast: true, coast_model: kalman}
